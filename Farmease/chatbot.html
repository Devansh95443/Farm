<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmease AI Assistant</title>
    <link rel="stylesheet" href="css/chatbot.css">
    <link rel="stylesheet" href="css/chatbot-styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="chatbot-container" class="chatbot-container">
        <div class="chatbot-header">
            <div class="chatbot-title">
                <i class="fas fa-robot header-icon"></i>
                <span>Farmease AI</span>
            </div>
            <div class="chatbot-actions">
                <button id="minimize-chatbot" aria-label="Minimize">
                    <i class="fas fa-minus"></i>
                </button>
                <button id="close-chatbot" aria-label="Close">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </div>

        <div id="chatbot-messages" class="chatbot-messages">
            <!-- Messages will be added here dynamically -->
        </div>

        <div class="chatbot-input-wrapper">
            <div class="chatbot-input-actions">
                <button id="image-upload" aria-label="Upload image">
                    <i class="fas fa-image"></i>
                </button>
                <input type="file" id="image-input" accept="image/*" hidden>
            </div>
            <input type="text" id="chatbot-input" placeholder="Ask about farming, weather, or schemes..." aria-label="Message input">
            <button id="send-message" aria-label="Send message">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>

        <div class="unread-indicator" style="display: none;">0</div>
    </div>

    <button id="chat-toggle" class="chat-toggle">
        <i class="fas fa-comments"></i>
        <span>Chat with Farmease AI</span>
    </button>

    <script src="js/chatbot.js"></script>
</body>
</html>
